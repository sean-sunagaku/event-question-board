# Render ${PARTICIPANT_DOMAIN}, ${ADMIN_DOMAIN}, ${API_DOMAIN}, ${TLS_CERT}, ${TLS_KEY}
# with envsubst restricted to exactly these five variables; see docs/self-hosting.md.
server {
    listen 443 ssl;
    server_name ${PARTICIPANT_DOMAIN};
    ssl_certificate ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    client_max_body_size 8k;
    # Do not log callback authorization codes/state in request query strings.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header OAI-Authenticated-User-ID "";
        proxy_set_header OAI-Authenticated-User-Email "";
        proxy_hide_header X-Powered-By;
    }
}
server {
    listen 443 ssl;
    server_name ${ADMIN_DOMAIN};
    ssl_certificate ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    client_max_body_size 8k;
    # Do not log callback authorization codes/state in request query strings.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
    }
}
server {
    listen 443 ssl;
    server_name ${API_DOMAIN};
    ssl_certificate ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    client_max_body_size 8k;
    # Do not log callback authorization codes/state in request query strings.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
    }
}
